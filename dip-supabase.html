<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIP評価システム</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Kaku Gothic Pro','メイリオ',sans-serif;background:#f0f2f8;color:#2c3040;min-height:100vh}
.page{max-width:720px;margin:0 auto;padding:16px 14px 60px}
h1{font-size:19px;font-weight:700;margin-bottom:18px;color:#1a237e}
h2{font-size:15px;font-weight:600;margin-bottom:10px;color:#283593}
h3{font-size:13px;font-weight:600;margin-bottom:6px;color:#3949ab}
.card{background:#fff;border-radius:12px;padding:18px;margin-bottom:14px;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.btn{display:inline-block;padding:10px 18px;border-radius:8px;border:none;cursor:pointer;font-size:14px;font-weight:600;transition:all .15s;outline:none}
.btn:active{transform:scale(.97)}
.btn-primary{background:#3949ab;color:#fff}
.btn-secondary{background:#e8eaf6;color:#3949ab}
.btn-success{background:#2e7d32;color:#fff}
.btn-danger{background:#c62828;color:#fff}
.btn-warn{background:#e65100;color:#fff}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-block{display:block;width:100%;margin-bottom:8px;text-align:center;padding:13px}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid #c5cae9;border-radius:8px;font-size:14px;margin-bottom:10px;outline:none;transition:border .15s;font-family:inherit;background:#fff;color:#2c3040}
input:focus,select:focus,textarea:focus{border-color:#3949ab}
textarea{resize:vertical;line-height:1.6;min-height:72px}
.badge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:11px;font-weight:600;vertical-align:middle}
.badge-req{background:#e8eaf6;color:#3949ab}
.badge-grow{background:#e8f5e9;color:#2e7d32}
.badge-stage{background:#fff3e0;color:#bf360c;font-size:10px}
.badge-store{background:#fce4ec;color:#880e4f}
.badge-active{background:#e8f5e9;color:#1b5e20}
.badge-period{background:#e3f2fd;color:#0d47a1}
.score-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.score-opt{position:relative}
.score-opt input{position:absolute;opacity:0;width:0;height:0}
.score-opt label{display:block;padding:7px 11px;border:1.5px solid #c5cae9;border-radius:7px;font-size:12px;cursor:pointer;transition:all .15s;white-space:nowrap}
.score-opt input:checked+label{background:#3949ab;color:#fff;border-color:#3949ab}
.gtoggle{display:flex;gap:8px;margin-top:8px}
.gbtn{flex:1;padding:10px;border:1.5px solid #c5cae9;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;background:#fff;transition:all .15s;text-align:center}
.gbtn.ok{background:#2e7d32;color:#fff;border-color:#2e7d32}
.gbtn.ng{background:#c62828;color:#fff;border-color:#c62828}
.item-name{font-size:14px;font-weight:600;margin:4px 0}
.item-desc{font-size:11px;color:#777;margin-bottom:8px;line-height:1.55}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.status-card{padding:14px;border-radius:10px;border:1.5px solid #e0e0e0;background:#fff;cursor:pointer;transition:all .15s}
.status-card:hover{border-color:#7986cb;background:#f3f4ff}
.s-name{font-weight:700;font-size:15px}
.s-status{font-size:12px;margin-top:4px}
.done{color:#2e7d32}.pending{color:#e65100}
.nav-back{display:inline-flex;align-items:center;gap:4px;color:#3949ab;background:none;border:none;font-size:13px;cursor:pointer;margin-bottom:16px;padding:4px 0;font-weight:600}
.alert{padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:13px;line-height:1.5}
.alert-info{background:#e8eaf6;color:#283593}
.alert-warn{background:#fff3e0;color:#bf360c}
.alert-ok{background:#e8f5e9;color:#1b5e20}
.chip{display:inline-block;padding:3px 10px;border-radius:12px;background:#e8eaf6;color:#3949ab;font-size:12px;margin:2px}
.check-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:9px}
.check-row input[type=checkbox]{margin-top:2px;width:15px;height:15px;flex-shrink:0;cursor:pointer}
.check-row label{font-size:13px;line-height:1.45;cursor:pointer}
.sec-head{background:#e8eaf6;padding:7px 12px;border-radius:6px;font-size:13px;font-weight:700;color:#283593;margin:14px 0 10px}
.store-head{background:#fce4ec;padding:8px 14px;border-radius:8px;font-size:14px;font-weight:700;color:#880e4f;margin:16px 0 10px;display:flex;align-items:center;justify-content:space-between}
.pbar{height:5px;background:#e0e0e0;border-radius:3px;margin-bottom:14px;overflow:hidden}
.pbar-fill{height:100%;background:#3949ab;border-radius:3px;transition:width .4s}
.stat-num{font-size:24px;font-weight:700}
.rate-bar{height:8px;background:#e0e0e0;border-radius:4px;overflow:hidden;margin-top:6px}
.rate-fill{height:100%;border-radius:4px;transition:width .4s}
.comment-box{font-size:12px;padding:7px 10px;background:#f5f7ff;border-radius:7px;border-left:3px solid #9fa8da;line-height:1.6;color:#444;margin-top:4px}
.staff-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #f0f0f0;flex-wrap:wrap}
.staff-row:last-child{border-bottom:none}
summary{cursor:pointer;font-size:12px;color:#888;margin-top:8px;outline:none;user-select:none}
details[open] summary{color:#3949ab}
.pw-eye{position:relative;display:flex;gap:6px;align-items:center;margin-bottom:10px}
.pw-eye input{margin-bottom:0;flex:1}
.pw-eye button{flex-shrink:0;padding:10px 12px;border:1.5px solid #c5cae9;border-radius:8px;background:#fff;cursor:pointer;font-size:13px;color:#666;width:44px}
/* タブ */
.tab-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab-btn{padding:7px 14px;border-radius:20px;border:1.5px solid #c5cae9;background:#fff;font-size:13px;font-weight:600;cursor:pointer;color:#555;transition:all .15s}
.tab-btn.active{background:#3949ab;color:#fff;border-color:#3949ab}
/* トレンドテーブル */
.trend-wrap{overflow-x:auto;margin-top:8px}
.trend-table{border-collapse:collapse;width:100%;font-size:12px;min-width:300px}
.trend-table th{background:#e8eaf6;color:#283593;padding:7px 10px;text-align:center;font-weight:600;white-space:nowrap;border:1px solid #c5cae9}
.trend-table th.left{text-align:left}
.trend-table td{padding:7px 10px;text-align:center;border:1px solid #e8eaf6;white-space:nowrap}
.trend-table td.label{text-align:left;font-weight:600;color:#333;background:#fafbff}
.trend-cell{display:inline-flex;align-items:center;gap:3px;justify-content:center}
.trend-up{color:#2e7d32;font-size:11px}
.trend-dn{color:#c62828;font-size:11px}
.trend-eq{color:#888;font-size:11px}
/* 期間バッジ */
.period-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #f0f0f0;flex-wrap:wrap}
.period-row:last-child{border-bottom:none}
</style>
</head>

<div class="page" id="app"></div>
<script>

================================================================ */
const SB_URL = 'https://sxugmsddxlyfxdlcquxc.supabase.co'; // ← SupabaseプロジェクトURL
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4dWdtc2RkeGx5ZnhkbGNxdXhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyODQ4NjIsImV4cCI6MjA5Mzg2MDg2Mn0.QNL4kXo_a5YEAltn-_DGQ34GqjgmLvTiObPp5Ta06ww'; // ← anon/public キー

/* ── Supabase REST ヘルパー ── */
const enc = encodeURIComponent;
const SBH = () => ({'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'});

async function sbGet(table, params='') {
  const r = await fetch(`${SB_URL}/rest/v1/${table}?${params}`, {headers:SBH()});
  if(!r.ok) throw new Error(`GET ${table} ${r.status}`);
  return r.json();
}
async function sbPost(table, body) {
  const r = await fetch(`${SB_URL}/rest/v1/${table}`, {
    method:'POST', headers:SBH(), body:JSON.stringify(body)});
  return r.ok;
}
async function sbPatch(table, body, params) {
  const r = await fetch(`${SB_URL}/rest/v1/${table}?${params}`, {
    method:'PATCH', headers:SBH(), body:JSON.stringify(body)});
  return r.ok;
}
async function sbDelete(table, params) {
  const r = await fetch(`${SB_URL}/rest/v1/${table}?${params}`, {
    method:'DELETE', headers:SBH()});
  return r.ok;
}
async function sbUpsert(table, body, conflict) {
  const h = {...SBH(), 'Prefer':'resolution=merge-duplicates'};
  const r = await fetch(`${SB_URL}/rest/v1/${table}?on_conflict=${conflict}`, {
    method:'POST', headers:h, body:JSON.stringify(body)});
  return r.ok;
}

/* ── インメモリキャッシュ ── */
const C = {stores:[],staff:[],goals:{},periods:[],settings:{},evals:[],ready:false};

/* ── データ読み込み（アプリ起動時に1回） ── */
async function loadAll() {
  const [stores,staff,goals,periods,settings,evals] = await Promise.all([
    sbGet('stores','select=name&order=created_at'),
    sbGet('staff','select=name,store,password&order=created_at'),
    sbGet('goals','select=staff_name,item_ids'),
    sbGet('periods','select=id,label,year,month&order=year,month'),
    sbGet('settings','select=key,value'),
    sbGet('evals','select=period_id,evaluator,target,scores,comments,ts'),
  ]);
  C.stores  = stores.map(r=>r.name);
  C.staff   = staff;
  C.goals   = Object.fromEntries(goals.map(r=>[r.staff_name, r.item_ids||[]]));
  C.periods = periods;
  C.settings= Object.fromEntries((settings||[]).map(r=>[r.key,r.value]));
  C.evals   = evals.map(e=>({...e,scores:e.scores||{},comments:e.comments||{}}));
  C.ready   = true;
}

/* ── キャッシュ読み出し関数（UIはこちらを使用） ── */
const getStores      = ()=>C.stores;
const getStaff       = ()=>C.staff;
const getGoals       = ()=>C.goals;
const getEvals       = ()=>C.evals;
const getPeriods     = ()=>[...C.periods].sort((a,b)=>a.year!==b.year?a.year-b.year:a.month-b.month);
const getCurrentPeriodId = ()=>C.settings.currentPeriodId||null;
const getCurrentPeriod   = ()=>getPeriods().find(p=>p.id===getCurrentPeriodId())||null;
const getAdminPw     = ()=>C.settings.adminpw||'tonton2025';
const staffInStore   = store=>C.staff.filter(s=>s.store===store);
const findStaff      = name=>C.staff.find(s=>s.name===name);
const hasEval        = (pid,ev,tg)=>C.evals.some(e=>e.period_id===pid&&e.evaluator===ev&&e.target===tg);
const getEvalsFor    = (target,periodId=null)=>C.evals.filter(e=>e.target===target&&(periodId===null||e.period_id===periodId));

/* ── 書き込み関数（キャッシュ即時更新 → Supabase同期） ── */
async function saveEval(periodId,evaluator,target,scores,comments={}){
  const ts=Date.now();
  C.evals=C.evals.filter(e=>!(e.period_id===periodId&&e.evaluator===evaluator&&e.target===target));
  C.evals.push({period_id:periodId,evaluator,target,scores,comments,ts});
  await sbUpsert('evals',{period_id:periodId,evaluator,target,scores,comments,ts},'period_id,evaluator,target');
}
async function addStoreDB(name){
  C.stores.push(name);render();await sbPost('stores',{name});
}
async function removeStoreDB(name){
  const removed=C.staff.filter(s=>s.store===name).map(s=>s.name);
  C.stores=C.stores.filter(s=>s!==name);
  C.staff=C.staff.filter(s=>s.store!==name);
  removed.forEach(n=>delete C.goals[n]);
  C.evals=C.evals.filter(e=>!removed.includes(e.evaluator)&&!removed.includes(e.target));
  render();
  await sbDelete('stores',`name=eq.${enc(name)}`);
  for(const n of removed){
    await sbDelete('goals',`staff_name=eq.${enc(n)}`);
    await sbDelete('evals',`evaluator=eq.${enc(n)}`);
    await sbDelete('evals',`target=eq.${enc(n)}`);
  }
  await sbDelete('staff',`store=eq.${enc(name)}`);
}
async function addStaffDB(name,store,password){
  C.staff.push({name,store,password});render();
  await sbPost('staff',{name,store,password});
}
async function removeStaffDB(name){
  C.staff=C.staff.filter(s=>s.name!==name);
  delete C.goals[name];
  C.evals=C.evals.filter(e=>e.evaluator!==name&&e.target!==name);
  render();
  await sbDelete('staff',`name=eq.${enc(name)}`);
  await sbDelete('goals',`staff_name=eq.${enc(name)}`);
  await sbDelete('evals',`evaluator=eq.${enc(name)}`);
  await sbDelete('evals',`target=eq.${enc(name)}`);
}
async function updateStaffPwDB(name,pw){
  const m=C.staff.find(s=>s.name===name);if(m)m.password=pw;
  await sbPatch('staff',{password:pw},`name=eq.${enc(name)}`);
}
async function toggleGoalDB(target,itemId,checked,el){
  const sel=C.goals[target]||[];
  if(checked){if(sel.length>=3){alert('最大3項目までです');el.checked=false;return;}sel.push(itemId);}
  else sel.splice(sel.indexOf(itemId),1);
  C.goals[target]=sel;
  const c=$('sel-count');if(c)c.textContent=sel.length;
  await sbUpsert('goals',{staff_name:target,item_ids:sel},'staff_name');
}
async function addPeriodDB(id,label,year,month){
  C.periods.push({id,label,year,month});
  C.settings.currentPeriodId=id;
  render();
  await sbPost('periods',{id,label,year,month});
  await sbUpsert('settings',{key:'currentPeriodId',value:id},'key');
}
async function setActivePeriodDB(id){
  C.settings.currentPeriodId=id;render();
  await sbUpsert('settings',{key:'currentPeriodId',value:id},'key');
}
async function removePeriodDB(id){
  C.periods=C.periods.filter(p=>p.id!==id);
  C.evals=C.evals.filter(e=>e.period_id!==id);
  if(C.settings.currentPeriodId===id){
    const newId=C.periods.length>0?C.periods[C.periods.length-1].id:null;
    C.settings.currentPeriodId=newId;
    if(newId)await sbUpsert('settings',{key:'currentPeriodId',value:newId},'key');
  }
  render();
  await sbDelete('periods',`id=eq.${enc(id)}`);
  await sbDelete('evals',`period_id=eq.${enc(id)}`);
}
async function changePwDB(p1){
  C.settings.adminpw=p1;
  await sbUpsert('settings',{key:'adminpw',value:p1},'key');
}

function staffLogin(){
  const stores=getStores(),cp=getCurrentPeriod();
  return`<button class="nav-back" onclick="go('home')">← ホームへ</button>
  <h1>スタッフログイン</h1>
  ${cp?`<div class="alert alert-info">📅 評価期間：<strong>${cp.label}</strong></div>`:''}
  <div class="card">
    <h2>① 店舗を選択</h2>
    <select id="sel-store" onchange="updateStaffSel()">
      <option value="">-- 店舗を選択 --</option>
      ${stores.map(s=>`<option value="${s}">${s}</option>`).join('')}
    </select>
    <h2>② 名前を選択</h2>
    <select id="sel-name"><option value="">-- 先に店舗を選択 --</option></select>
    <h2 style="margin-top:4px">③ パスワード</h2>
    <div class="pw-eye">
      <input type="password" id="staff-pw" placeholder="個人パスワードを入力" onkeydown="if(event.key==='Enter')doStaffLogin()">
      <button onclick="togglePw('staff-pw',this)">👁</button>
    </div>
    <button class="btn btn-primary btn-block" onclick="doStaffLogin()">ログイン</button>
    <p id="login-err" style="color:#c62828;font-size:13px;margin-top:6px;min-height:18px"></p>
  </div>
  <div class="alert alert-info" style="font-size:12px">🔒 評価は匿名で集計されます。</div>`;
}
function updateStaffSel(){
  const store=$('sel-store')?.value,sel=$('sel-name');
  if(!sel)return;
  if(!store){sel.innerHTML='<option value="">-- 先に店舗を選択 --</option>';return;}
  sel.innerHTML='<option value="">-- 名前を選択 --</option>'+
    staffInStore(store).map(m=>`<option value="${m.name}">${m.name}</option>`).join('');
}
function doStaffLogin(){
  const store=$('sel-store')?.value,name=$('sel-name')?.value,
        pw=$('staff-pw')?.value,err=$('login-err');
  if(!store||!name){err.textContent='店舗と名前を選択してください';return;}
  if(!pw){err.textContent='パスワードを入力してください';return;}
  const m=findStaff(name);
  if(!m||m.store!==store||m.password!==pw){err.textContent='パスワードが違います';return;}
  const cp=getCurrentPeriodId();
  if(!cp){err.textContent='評価期間が設定されていません。管理者にご確認ください。';return;}
  go('evalList',{user:name,userStore:store,periodId:cp});
}
function togglePw(id,btn){
  const el=$(id);if(!el)return;
  el.type=el.type==='password'?'text':'password';
  btn.textContent=el.type==='password'?'👁':'🙈';
}

        <label style="font-size:12px;color:#888;display:block;margin-bottom:4px">年</label>
        <select id="p-year" style="margin:0">
          ${[-1,0,1].map(d=>{const y=now.getFullYear()+d;return`<option value="${y}" ${d===0?'selected':''}>${y}年</option>`}).join('')}
        </select>
      </div>
      <div style="flex:1;min-width:100px">
        <label style="font-size:12px;color:#888;display:block;margin-bottom:4px">月</label>
        <select id="p-month" style="margin:0">
          ${Array.from({length:12},(_,i)=>i+1).map(m=>`<option value="${m}" ${m===now.getMonth()+1?'selected':''}>${m}月</option>`).join('')}
        </select>
      </div>
      <button class="btn btn-primary btn-sm" style="flex-shrink:0;margin-bottom:10px" onclick="addPeriod()">追加してアクティブに</button>
    </div>
    <p id="period-msg" style="font-size:13px;margin-top:4px;min-height:18px"></p>
  </div>`;
}
function addPeriod(){
  const year=parseInt($('p-year')?.value),month=parseInt($('p-month')?.value);
  const label=`${year}年${month}月`;
  const msg=$('period-msg');
  const periods=getPeriods();
  if(periods.some(p=>p.year===year&&p.month===month)){
    msg.textContent=`${label} は既に登録されています`;msg.style.color='#c62828';return;}
  const id='p_'+Date.now();
  periods.push({id,label,year,month});
  LS.set('periods',periods);
  LS.set('currentPeriodId',id);
  msg.textContent=`✓ ${label} を追加してアクティブにしました`;msg.style.color='#2e7d32';
  render();
}
function setActivePeriod(id){
  LS.set('currentPeriodId',id);render();
}
function removePeriod(id,label){
  const cnt=getEvals().filter(e=>e.periodId===id).length;
  if(!confirm(`「${label}」を削除しますか？\n${cnt}件の評価データも削除されます。`))return;
  LS.set('periods',getPeriods().filter(p=>p.id!==id));
  LS.set('evals',getEvals().filter(e=>e.periodId!==id));
  if(getCurrentPeriodId()===id){
    const remaining=getPeriods().filter(p=>p.id!==id);
    LS.set('currentPeriodId',remaining.length>0?remaining[remaining.length-1].id:null);
  }
  render();
}

function addStore(){

  stores.push(name);LS.set('stores',stores);

}
function removeStore(name){
  const cnt=staffInStore(name).length;
  if(!confirm(`「${name}」を削除しますか？\n所属スタッフ${cnt}名と評価データも削除されます。`))return;
  LS.set('stores',getStores().filter(s=>s!==name));
  const removed=getStaff().filter(s=>s.store===name).map(s=>s.name);
  LS.set('staff',getStaff().filter(s=>s.store!==name));
  const g=getGoals();removed.forEach(n=>delete g[n]);LS.set('goals',g);
  LS.set('evals',getEvals().filter(e=>!removed.includes(e.evaluator)&&!removed.includes(e.target)));
  render();
}

function addStaff(store){

  if(staff.some(s=>s.name===name)){if(msg){msg.textContent='同じ名前が既に登録されています';msg.style.color='#c62828';}return;}

  LS.set('staff',getStaff().filter(s=>s.name!==name));
  const g=getGoals();delete g[name];LS.set('goals',g);
  LS.set('evals',getEvals().filter(e=>e.evaluator!==name&&e.target!==name));render();

function updateStaffPw(name,pw){
  const staff=getStaff(),m=staff.find(s=>s.name===name);
  if(m){m.password=pw;LS.set('staff',staff);}

function toggleGoal(target,itemId,checked,el){
  const goals=getGoals(),sel=goals[target]||[];
  if(checked){if(sel.length>=3){alert('最大3項目までです');el.checked=false;return;}sel.push(itemId);}
  else sel.splice(sel.indexOf(itemId),1);
  goals[target]=sel;LS.set('goals',goals);
  const c=$('sel-count');if(c)c.textContent=sel.length;
}

                  <div style="display:flex;align-items:baseline;gap:8px;font-size:12px;padding:3px 0;border-bottom:1px solid #fde8e8">

              </div>`:''}
            <div style="background:#f3f4ff;border-radius:8px;padding:10px;border-left:3px solid #3949ab">
              <div style="font-size:11px;font-weight:700;color:#283593;margin-bottom:6px">📊 採点スケール</div>

                <div style="display:flex;align-items:baseline;gap:8px;font-size:12px;padding:3px 0;border-bottom:1px solid #e8eaf6">

function setGrowth(itemId,val,btn){
  growthVals[itemId]=val;
  btn.closest('.gtoggle').querySelectorAll('.gbtn').forEach(b=>b.classList.remove('ok','ng'));
  btn.classList.add(val===1?'ok':'ng');
}
function submitEval(){
  const {user,userStore,periodId,evalTarget}=S;
  const itemIds=getGoals()[evalTarget]||[];
  const items=itemIds.map(id=>ALL_ITEMS.find(i=>i.id===id)).filter(Boolean);
  const scores={},comments={};let allFilled=true;
  for(const item of items){
    const isReq=REQUIRED.some(r=>r.id===item.id);
    if(isReq){
      const sel=document.querySelector(`input[name="sc_${item.id}"]:checked`);
      if(!sel){allFilled=false;break;}scores[item.id]=parseFloat(sel.value);
    }else{
      if(growthVals[item.id]===undefined){allFilled=false;break;}scores[item.id]=growthVals[item.id];
    }
    const cm=document.getElementById('cm_'+item.id);
    if(cm&&cm.value.trim())comments[item.id]=cm.value.trim();
  }
  if(!allFilled){const m=$('eval-msg');m.textContent='⚠ 全ての項目を評価してください';m.style.color='#c62828';return;}
  saveEval(periodId,user,evalTarget,scores,comments);
  go('evalList',{user,userStore,periodId});
}

tyle="font-size:13px;color:#aaa">評価なし</span>';     }else{       if(scores.length>0){         const ok=scores.filter(v=>v===1).length;         const pct=Math.round(ok/scores.length*100);         summary=`<div style="margin-top:10px"><div style="display:flex;align-items:baseline;gap:6px;margin-bottom:6px"><span class="stat-num" style="color:${pct>=60?'#2e7d32':'#bf360c'}">${pct}%</span><span style="font-size:14px;color:#888">達成率</span></div><div class="rate-bar"><div class="rate-fill" style="width:${pct}%;background:${pct>=60?'#2e7d32':'#ef5350'}"></div></div><div style="font-size:11px;color:#aaa;margin-top:4px">${n}名中 ${ok}名がOK</div></div>`;       }else summary='<span style="font-size:13px;color:#aaa">評価なし</span>';     }     const withComment=evals.filter(e=>(e.comments||{})[item.id]);     const anonComments=withComment.length===0?'':`<details style="margin-top:8px"><summary>▸ コメント（匿名・${withComment.length}件）</summary><div style="margin-top:8px;display:flex;flex-direction:column;gap:6px">${withComment.map(e=>`<div class="comment-box">${(e.comments||{})[item.id]}</div>`).join('')}</div></details>`;     return`<div class="card"><div style="display:flex;gap:6px;align-items:center;margin-bottom:6px"><span class="badge ${isReq?'badge-req':'badge-grow'}">${isReq?'必修':'成長'}</span>${!isReq?`<span class="badge badge-stage">${item.stage}</span>`:''}<span style="font-size:12px;color:#888">${item.cat}</span></div><div style="font-weight:700;font-size:14px">${item.name}</div>${summary}${anonComments}</div>`;   }).join('')}`; }  /* ══════ 評価状況確認 ══════ */

/* ══════ フィードバック表示 ══════ */
function feedbackView(){
  const {fbTarget:target,fbMode,fbPeriodId}=S;
  const goals=getGoals(),itemIds=goals[target]||[];
  const allPeriods=getPeriods().filter(p=>getEvals().some(e=>e.target===target&&e.periodId===p.id));
  const memberInfo=findStaff(target);
  const cp=getCurrentPeriod();

  // タブボタン
  const tabs=`<div class="tab-row">
    <button class="tab-btn ${fbMode==='trend'?'active':''}" onclick="S.fbMode='trend';render()">📈 トレンド（全期間）</button>
    ${allPeriods.slice().reverse().map(p=>`
      <button class="tab-btn ${fbMode==='period'&&fbPeriodId===p.id?'active':''}"
        onclick="S.fbMode='period';S.fbPeriodId='${p.id}';render()">${p.label}</button>`).join('')}
    ${allPeriods.length===0?`<span style="font-size:13px;color:#aaa;padding:8px">まだ評価データがありません</span>`:''}
  </div>`;

  const header=`<button class="nav-back" onclick="go('feedbackMenu')">← 一覧へ</button>
  <h1>${target} さんへのフィードバック</h1>
  <div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;align-items:center">
    ${memberInfo?`<span class="badge badge-store">${memberInfo.store}</span>`:''}
  </div>
  ${itemIds.length===0?'<div class="alert alert-warn">取り組みが設定されていません。</div>':''}
  ${tabs}`;

  if(itemIds.length===0)return header;
  const items=itemIds.map(id=>ALL_ITEMS.find(i=>i.id===id)).filter(Boolean);

  /* ---- トレンド表示 ---- */
  if(fbMode==='trend'){
    if(allPeriods.length===0)return header+'<div class="alert alert-warn">まだ評価データがありません。</div>';

    // 各期間×各項目の集計値
    function calcValue(item,periodId){
      const isReq=REQUIRED.some(r=>r.id===item.id);
      const ev=getEvalsFor(target,periodId);
      const scores=ev.map(e=>e.scores[item.id]).filter(v=>v!==undefined);
      if(scores.length===0)return null;
      if(isReq)return (scores.reduce((a,b)=>a+b,0)/scores.length);
      return Math.round(scores.filter(v=>v===1).length/scores.length*100);
    }
    function trendArrow(vals){
      const filtered=vals.filter(v=>v!==null);
      if(filtered.length<2)return'';
      const last=filtered[filtered.length-1],prev=filtered[filtered.length-2];
      if(last>prev)return'<span class="trend-up">▲</span>';
      if(last<prev)return'<span class="trend-dn">▼</span>';
      return'<span class="trend-eq">─</span>';
    }
    function cellColor(item,val){
      if(val===null)return'color:#ccc';
      const isReq=REQUIRED.some(r=>r.id===item.id);
      if(isReq){
        const maxS=Math.max(...item.opts.map(([v])=>v));
        const minS=Math.min(...item.opts.map(([v])=>v));
        const pct=(val-minS)/(maxS-minS);
        if(pct>=0.7)return'color:#1b5e20;font-weight:700';
        if(pct>=0.4)return'color:#283593';
        return'color:#b71c1c';
      }else{
        if(val>=80)return'color:#1b5e20;font-weight:700';
        if(val>=50)return'color:#283593';
        return'color:#b71c1c';
      }
    }

    const trendTable=`<div class="trend-wrap">
      <table class="trend-table">
        <thead><tr>
          <th class="left" style="min-width:120px">取り組み</th>
          ${allPeriods.map(p=>`<th>${p.label}</th>`).join('')}
          <th>推移</th>
        </tr></thead>
        <tbody>
          ${items.map(item=>{
            const isReq=REQUIRED.some(r=>r.id===item.id);
            const vals=allPeriods.map(p=>calcValue(item,p.id));
            return`<tr>
              <td class="label">
                <span class="badge ${isReq?'badge-req':'badge-grow'}" style="margin-right:4px">${isReq?'必修':'成長'}</span>${item.name}
              </td>
              ${vals.map((v,i)=>`<td style="${cellColor(item,v)}">
                ${v===null?'─':isReq?v.toFixed(1)+'点':v+'%'}
              </td>`).join('')}
              <td style="text-align:center">${trendArrow(vals)}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`;

    return header+`<div class="card">${trendTable}</div>`;
  }

  /* ---- 月別詳細表示 ---- */
  const selectedPeriod=getPeriods().find(p=>p.id===fbPeriodId);
  const evals=getEvalsFor(target,fbPeriodId);
  const n=evals.length;

  return header+
  `${selectedPeriod?`<div class="alert alert-info" style="margin-bottom:6px">📅 <strong>${selectedPeriod.label}</strong> ／ 評価者数：<strong>${n}</strong>名</div>`:''}
  ${n===0?'<div class="alert alert-warn">この期間の評価がまだありません。</div>':''}
  ${items.map(item=>{
    const isReq=REQUIRED.some(r=>r.id===item.id);
    const scores=evals.map(e=>e.scores[item.id]).filter(v=>v!==undefined);
    let summary='';
    if(isReq){
      if(scores.length>0){
        const avg=(scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(2);
        const maxS=Math.max(...item.opts.map(([v])=>v));
        const minS=Math.min(...item.opts.map(([v])=>v));
        const pct=maxS!==minS?Math.max(0,Math.min(100,Math.round((parseFloat(avg)-minS)/(maxS-minS)*100))):50;
        summary=`<div style="margin-top:10px">
          <div style="display:flex;align-items:baseline;gap:6px;margin-bottom:6px">
            <span class="stat-num" style="color:#3949ab">${avg}</span>
            <span style="font-size:14px;color:#888">点（平均）</span>
          </div>
          <div class="rate-bar"><div class="rate-fill" style="width:${pct}%;background:#3949ab"></div></div>
          <div style="font-size:11px;color:#aaa;margin-top:4px">内訳: ${scores.join(', ')} 点</div>
        </div>`;
      }else summary='<span style="font-size:13px;color:#aaa">評価なし</span>';
    }else{
      if(scores.length>0){
        const ok=scores.filter(v=>v===1).length;
        const pct=Math.round(ok/scores.length*100);
        summary=`<div style="margin-top:10px">
          <div style="display:flex;align-items:baseline;gap:6px;margin-bottom:6px">
            <span class="stat-num" style="color:${pct>=60?'#2e7d32':'#bf360c'}">${pct}%</span>
            <span style="font-size:14px;color:#888">達成率</span>
          </div>
          <div class="rate-bar"><div class="rate-fill" style="width:${pct}%;background:${pct>=60?'#2e7d32':'#ef5350'}"></div></div>
          <div style="font-size:11px;color:#aaa;margin-top:4px">${n}名中 ${ok}名がOK</div>
        </div>`;
      }else summary='<span style="font-size:13px;color:#aaa">評価なし</span>';
    }
    const withComment=evals.filter(e=>(e.comments||{})[item.id]);
    const anonComments=withComment.length===0?'':`
      <details style="margin-top:8px">
        <summary>▸ コメント一覧（匿名・${withComment.length}件）</summary>
        <div style="margin-top:8px;display:flex;flex-direction:column;gap:6px">
          ${withComment.map(e=>`<div class="comment-box">${(e.comments||{})[item.id]}</div>`).join('')}
        </div>
      </details>`;
    const adminDetail=`
      <details style="margin-top:6px">
        <summary>▸ 評価者別詳細（管理者専用）</summary>
        <div style="margin-top:8px;padding:10px;background:#f8f9ff;border-radius:8px">
          ${evals.length===0?'<span style="font-size:13px;color:#aaa">評価なし</span>':
          evals.map(e=>{
            const cm=(e.comments||{})[item.id];
            const lbl=e.scores[item.id]!==undefined?(isReq?e.scores[item.id]+'点':e.scores[item.id]===1?'OK':'NG'):'-';
            return`<div style="padding:7px 0;border-bottom:1px solid #eee">
              <div style="display:flex;justify-content:space-between;font-size:12px">
                <span style="color:#555;font-weight:600">${e.evaluator}</span>
                <span style="font-weight:700;color:#3949ab">${lbl}</span>
              </div>
              ${cm?`<div style="font-size:11px;color:#555;margin-top:5px;padding:5px 8px;background:#fff;border-radius:5px;border-left:2px solid #7986cb;line-height:1.6">${cm}</div>`:''}
            </div>`;
          }).join('')}
        </div>
      </details>`;
    return`<div class="card">
      <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px">
        <span class="badge ${isReq?'badge-req':'badge-grow'}">${isReq?'必修':'成長'}</span>
        ${!isReq?`<span class="badge badge-stage">${item.stage}</span>`:''}
        <span style="font-size:12px;color:#888">${item.cat}</span>
      </div>
      <div style="font-weight:700;font-size:14px">${item.name}</div>
      ${summary}${anonComments}${adminDetail}
    </div>`;
  }).join('')}`;
}



/* ── 書き込み関数（UI向けラッパー） ── */
async function addStore(){
  const name=$('new-store')?.value?.trim(),msg=$('store-msg');
  if(!name)return;
  if(C.stores.includes(name)){msg.textContent='同じ店舗名が既に登録されています';msg.style.color='#c62828';return;}
  msg.textContent=`✓ ${name} を追加しました`;msg.style.color='#2e7d32';
  await addStoreDB(name);
}
async function removeStore(name){
  const cnt=staffInStore(name).length;
  if(!confirm(`「${name}」を削除しますか？\n所属スタッフ${cnt}名と評価データも削除されます。`))return;
  await removeStoreDB(name);
}
async function addStaff(store){
  const name=$(`ns_${store}`)?.value?.trim(),pw=$(`np_${store}`)?.value?.trim();
  const msg=$(`smsg_${store}`);
  if(!name||!pw){if(msg){msg.textContent='名前とパスワードを入力してください';msg.style.color='#c62828';}return;}
  if(C.staff.some(s=>s.name===name)){if(msg){msg.textContent='同じ名前が既に登録されています';msg.style.color='#c62828';}return;}
  if(msg){msg.textContent=`✓ ${name} を追加しました`;msg.style.color='#2e7d32';}
  await addStaffDB(name,store,pw);
}
async function removeStaff(name){
  if(!confirm(`${name} を削除しますか？\n関連する評価データも削除されます。`))return;
  await removeStaffDB(name);
}
async function updateStaffPw(name,pw){ await updateStaffPwDB(name,pw); }
async function toggleGoal(target,itemId,checked,el){ await toggleGoalDB(target,itemId,checked,el); }
async function addPeriod(){
  const year=parseInt($('p-year')?.value),month=parseInt($('p-month')?.value);
  const label=`${year}年${month}月`,msg=$('period-msg');
  if(C.periods.some(p=>p.year===year&&p.month===month)){
    msg.textContent=`${label} は既に登録されています`;msg.style.color='#c62828';return;}
  const id='p_'+Date.now();
  msg.textContent=`✓ ${label} を追加してアクティブにしました`;msg.style.color='#2e7d32';
  await addPeriodDB(id,label,year,month);
}
async function setActivePeriod(id){ await setActivePeriodDB(id); }
async function removePeriod(id,label){
  const cnt=C.evals.filter(e=>e.period_id===id).length;
  if(!confirm(`「${label}」を削除しますか？\n${cnt}件の評価データも削除されます。`))return;
  await removePeriodDB(id);
}
async function changePw(){
  const p1=$('np1')?.value,p2=$('np2')?.value,msg=$('pwmsg');
  if(!p1||p1.length<4){msg.textContent='4文字以上で入力してください';msg.style.color='#c62828';return;}
  if(p1!==p2){msg.textContent='パスワードが一致しません';msg.style.color='#c62828';return;}
  msg.textContent='✓ 変更しました';msg.style.color='#2e7d32';
  await changePwDB(p1);
}
async function submitEval(){
  const {user,userStore,periodId,evalTarget}=S;
  const itemIds=getGoals()[evalTarget]||[];
  const items=itemIds.map(id=>ALL_ITEMS.find(i=>i.id===id)).filter(Boolean);
  const scores={},comments={};let allFilled=true;
  for(const item of items){
    const isReq=REQUIRED.some(r=>r.id===item.id);
    if(isReq){
      const sel=document.querySelector(`input[name="sc_${item.id}"]:checked`);
      if(!sel){allFilled=false;break;}scores[item.id]=parseFloat(sel.value);
    }else{
      if(growthVals[item.id]===undefined){allFilled=false;break;}scores[item.id]=growthVals[item.id];
    }
    const cm=document.getElementById('cm_'+item.id);
    if(cm&&cm.value.trim())comments[item.id]=cm.value.trim();
  }
  if(!allFilled){const m=$('eval-msg');m.textContent='⚠ 全ての項目を評価してください';m.style.color='#c62828';return;}
  const btn=document.querySelector('.btn-success');
  if(btn){btn.textContent='送信中…';btn.disabled=true;}
  await saveEval(periodId,user,evalTarget,scores,comments);
  go('evalList',{user,userStore,periodId});
}
